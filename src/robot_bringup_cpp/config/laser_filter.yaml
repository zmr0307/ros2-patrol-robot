# laser_filter.yaml
# 激光雷达角度滤波器配置 - 排除立柱遮挡区域
#
# 问题背景：
#   - 激光雷达位置：(0.258, 0, 0.318) 相对base_link（前方25.8cm，高度31.8cm）
#   - 立柱位置：(0, 0, 0.25) 相对base_link（中心位置，高度范围-25cm到+75cm）
#   - 立柱尺寸：14.4cm × 14.4cm × 100cm
#   - 遮挡角度：约31.2°（164.4° 到 195.6°）
#   - 实际遮挡：立柱实际遮挡约31.2°
#
# 当前配置（对称方案）：
#   - 使用LaserScanAngularBoundsFilter过滤后方52°的区域（两边各26°）
#   - 保留前方308°的有效扫描范围（-154° 到 +154°）
#   - 过滤后的数据发布到 /scan_filtered 话题
#   - ✅ 对称遮挡，避免扫描匹配时的不对称偏差

laser_filter:  # 节点名称必须与launch文件中的name参数匹配
  ros__parameters:
    # 滤波器配置（参数必须放在params层级下）
    filter1:
      name: angle
      type: laser_filters/LaserScanAngularBoundsFilter
      params:
        lower_angle: -2.688  # -154° (弧度) - 保留前方右侧154°（右侧遮挡26°）
        upper_angle: 2.688   # +154° (弧度) - 保留前方左侧154°（左侧遮挡26°）

