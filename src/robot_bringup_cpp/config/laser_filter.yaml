# laser_filter.yaml
# 激光雷达角度滤波器配置 - 排除立柱遮挡区域
#
# 问题背景：
#   - 激光雷达位置：(0.258, 0, 0.322) 相对base_link（前方25.8cm，高度32.2cm）
#   - 立柱位置：(0, 0, 0.25) 相对base_link（中心位置，高度范围-25cm到+75cm）
#   - 立柱尺寸：14.4cm × 14.4cm × 100cm
#   - 遮挡角度：约31.2°（164.4° 到 195.6°）
#   - 实际遮挡：立柱实际遮挡约31.2°
#
# 当前配置（非对称过滤方案）：
#   - 使用LaserScanAngularBoundsFilter过滤后方45°的区域
#   - 保留前方315°的有效扫描范围（-151° 到 +164°）
#   - 过滤分布：右侧29° + 左侧16°（非对称，补偿实际遮挡偏移）
#   - 过滤后的数据发布到 /scan_filtered 话题
#   - ✅ 排除范围（45°）大于实际遮挡（31.2°），留13.8°安全余量

laser_filter:  # 节点名称必须与launch文件中的name参数匹配
  ros__parameters:
    # 滤波器配置（参数必须放在params层级下）
    filter1:
      name: angle
      type: laser_filters/LaserScanAngularBoundsFilter
      params:
        lower_angle: -2.635  # -151° (弧度) - 保留前方右侧151°
        upper_angle: 2.862   # +164° (弧度) - 保留前方左侧164°

