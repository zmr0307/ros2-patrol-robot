slam_toolbox:
  ros__parameters:
    
    # Plugin params (ROS2 Humble required)
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None
    use_sim_time: false

    # ###########################
    # #### 核心参数 (至关重要) ####
    # ###########################

    # 1. 定义坐标系 (Frames)
    #    根据你的diff_drive_controller.yaml，base_frame_id是base_footprint
    odom_frame: odom              # 里程计坐标系，由ros2_control的差分驱动控制器发布
    map_frame: map                # 地图坐标系，由SLAM系统发布，是固定在世界上的最终参考系
    base_frame: base_footprint    # 必须与diff_drive_controller.yaml中的base_frame_id一致

    # 2. 定义传感器话题
    scan_topic: /scan_filtered  # 使用过滤后的激光数据（排除立柱遮挡区域）
    use_map_saver: true

    # ###########################
    # #### 模式与性能 ####
    # ###########################

    # 3. 设置工作模式
    mode: mapping  # mapping模式用于构建地图
    enable_interactive_mode: true  # 启用交互模式用于手动回环检测

    # 4. 启用扫描匹配
    use_scan_matching: true
    use_scan_barycenter: true
    
    # ###########################
    # #### 地图与传感器参数 ####
    # ###########################

    # 地图更新间隔 (秒)
    map_update_interval: 0.5
    
    # 地图分辨率 (米/像素) - 100㎡大场地高精度配置
    resolution: 0.02  # 2cm/像素（从2.5cm提高），墙壁更细、转角更锐利
    
    # 激光雷达范围限制 (保守配置，提高数据质量)
    min_laser_range: 0.15   # 过滤15cm内噪声和自身干扰（从0.1提高）
    max_laser_range: 10.0   # 办公室环境优化，过滤远距离噪声（从12.0降低）

    # ###########################
    # #### ROS2 Humble必需参数 ####
    # ###########################
    
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    minimum_time_interval: 0.1      # 🔧 平衡优化：0.1s强制更新（匹配10Hz激光频率）
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000

    # 运动阈值 (优化转弯跳变：降低阈值让转弯时也密集创建节点)
    minimum_travel_distance: 0.02   # 2cm（保持），直行时更密集
    minimum_travel_heading: 0.0175  # 🔧 平衡优化：1.0°（每度创建节点），90°旋转创建90个节点，足够密集
    
    # 扫描缓冲区 (⚠️ 关键修复！保留完整轨迹用于回环检测，提高回环成功率)
    scan_buffer_size: 30000                  
    scan_buffer_maximum_scan_distance: 10.0   # 与max_laser_range保持一致（思岚S2L官方18m，我们限制10m）
    
    # 回环检测 (极限宽松模式：最大化回环成功率，52°盲区+编码器大误差专用)
    do_loop_closing: true
    loop_match_minimum_chain_size: 1          # 🔧 降到1（单次匹配即可，最大化触发概率）
    loop_match_maximum_variance_coarse: 30.0  # 🔧 提高到30（容忍极大累积误差）
    loop_match_minimum_response_coarse: 0.08  # 🔧 降到0.08（极限低阈值）
    loop_search_maximum_distance: 12.0        # 🔧 扩大到12m（更大搜索范围）
    loop_match_minimum_response_fine: 0.15    # 🔧 降到0.15（极限低阈值）

    # 🔧 搜索空间参数（极大范围搜索）
    loop_search_space_resolution: 0.1         # ✅ 搜索分辨率放宽
    loop_search_space_smear_deviation: 0.1    # 🔧 提高到0.1（最大搜索容错）
    correlation_search_space_smear_deviation: 0.1  # ✅ 正确！上限为0.1（0.2会崩溃）
    use_response_expansion: true              # 🆕 新增：自动扩展搜索网格（初始搜索失败时）

    # 🔴 数值稳定性参数（必须使用默认值，防止协方差矩阵爆炸！）
    minimum_angle_penalty: 0.9                # 🔴 恢复默认值！这是数值稳定性下界，不是阈值！
    minimum_distance_penalty: 0.5             # 🔴 恢复默认值！降低会导致优化器崩溃！

    # 🔧 方差惩罚参数（平衡模式：适度降低对编码器角度的信任）
    angle_variance_penalty: 1.0               # 🔧 平衡值1.0（编码器旋转误差大，适度不信任角度）
    distance_variance_penalty: 0.5            # 🔧 标准值0.5（位置相对准确，保持标准信任度）

    # ⚠️ 注意：以下参数可能不被slam_toolbox支持，已注释
    # coarse_search_angle_offset: 0.524       # slam_toolbox可能不支持此参数
    # coarse_angle_resolution: 0.0349         # slam_toolbox可能不支持此参数
    # fine_search_angle_offset: 0.0175        # slam_toolbox可能不支持此参数
    # 
    # slam_toolbox通过correlation_search_space_*参数控制搜索范围（已在上方配置）
